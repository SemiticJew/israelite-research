<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found — Semitic Jew</title>
  <meta name="theme-color" content="#054A91">
  <meta name="robots" content="noindex">
  <script>
    // Short verse links (/v/...) are routed before anything else loads.
    (function(){
      if (!/^\/v\//i.test(location.pathname)) return;
      var path = location.pathname + location.search + location.hash;
      document.documentElement.setAttribute('data-routing', 'verse');
      location.replace('/v/index.html?path=' + encodeURIComponent(path));
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=sj2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=sj2">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/sj-tokens.css">
  <link rel="stylesheet" href="/css/institution.css">
</head>
<body class="sj-inst not-found-page">
<div id="site-header"></div>
<main>
  <section class="in-hero in-hero--card">
    <p class="in-kicker">Error 404</p>
    <h1 class="in-title">Page not found</h1>
    <p class="in-lede" id="message">This link could not be found.</p>
    <p class="in-fineprint">If this was a Semitic Jew verse link, it will be routed to the short verse page.</p>
    <div class="in-actions">
      <a class="in-btn" href="/">Return Home</a>
      <a class="in-btn in-btn--quiet" href="/search.html">Search the Site</a>
      <a class="in-btn in-btn--quiet" href="/articles.html">Articles</a>
      <a class="in-btn in-btn--quiet" href="/biblia.html">Biblia</a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script>
  if (document.documentElement.getAttribute('data-routing') === 'verse') {
    var m = document.getElementById('message'); if (m) m.textContent = 'Routing to the short verse page.';
  }
</script>
<script src="/js/include.js"></script>
</body>
</html>
