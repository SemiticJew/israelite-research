<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Newsletter — Semitic Jew</title>

<link rel="stylesheet" href="/styles.css"/>

<style>

/* ========================= */
/* MINIMAL NEWSLETTER PAGE  */
/* ========================= */

.newsletter-hero{
  min-height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px 20px;
  background:var(--surface);
}

.newsletter-hero h1{
  margin:0;
  font-size:2.2rem;
  font-weight:800;
  color:var(--ink);
  max-width:700px;
}

.newsletter-hero p{
  margin-top:16px;
  max-width:600px;
  color:var(--muted);
  line-height:1.6;
  font-size:1rem;
}

.newsletter-form{
  margin-top:28px;
  width:100%;
  max-width:420px;
}

/* Zeffy newsletter form */
.newsletter-signup-form{
  width:100%;
  max-width:720px;
  margin:28px auto 0;
}

.newsletter-signup-form [data-zeffy-embed],
.newsletter-signup-form [data-zeffy-embed-fallback],
.zeffy-embed-frame{
  width:100%;
}

.zeffy-embed-frame{
  position:relative;
  overflow:hidden;
  min-height:460px;
}

.zeffy-embed-frame iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

@media(max-width:620px){
  .newsletter-hero{
    min-height:auto;
    padding:56px 16px 48px;
  }

  .newsletter-hero h1{
    font-size:1.8rem;
  }

  .zeffy-embed-frame{
    min-height:500px;
  }
}

.newsletter-note{
  margin-top:14px;
  font-size:.85rem;
  color:var(--muted);
}

</style>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<meta name="theme-color" content="#054A91"/>

</head>

<body>

<div id="site-header"></div>

<main>

  <section class="newsletter-hero">

    <h1>Get Biblical Truth Without Religious Bias</h1>

    <p>
      Structured biblical analysis, historical evidence, and uncensored research—
      delivered directly to your inbox.
    </p>

    <div class="newsletter-form newsletter-signup-form">
      <div
        data-zeffy-embed
        data-form-url="/en-US/embed/newsletter-form/subscribe-to-get-notified-about-new-events-92942">
      </div>
      <div data-zeffy-embed-fallback style="display:none;">
        <div class="zeffy-embed-frame">
          <iframe
            title="Join the Semitic Jew Newsletter for Weekly Updates"
            data-zeffy-embed-src="https://www.zeffy.com/en-US/embed/newsletter-form/subscribe-to-get-notified-about-new-events-92942"
            allowtransparency="true">
          </iframe>
        </div>
      </div>
    </div>

    <p class="newsletter-note">
      No spam. Unsubscribe anytime.
    </p>

  </section>

</main>

<div id="site-footer"></div>

<script src="/js/include.js"></script>
<script
  src="https://www.zeffy.com/embed/v2/zeffy-embed.js"
  onerror="document.querySelectorAll('[data-zeffy-embed-fallback]').forEach(function(el){el.style.display='block';el.querySelectorAll('iframe[data-zeffy-embed-src]').forEach(function(f){f.src=f.getAttribute('data-zeffy-embed-src');});});">
</script>

</body>
</html>
