name: Semitic Jew Weekly Publisher

on:
  schedule:
    # 11:00 UTC is 7:00 AM EDT and 6:00 AM EST.
    - cron: "0 11 * * 5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional ISO date or datetime for a deterministic test run"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-publisher
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install optional integration dependency
        run: python3 -m pip install -r automation/weekly_publisher/requirements.txt

      - name: Validate project journal
        run: python3 -m json.tool automation/weekly_publisher/project-status.json >/dev/null

      - name: Run weekly publisher tests
        run: python3 -m unittest discover -s automation/weekly_publisher/tests -v

      - name: Prepare temporary GA4 credentials
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "$GA4_SERVICE_ACCOUNT_JSON" ]]; then
            umask 077
            credential_file="$(mktemp)"
            printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > "$credential_file"
            printf 'GA4_CREDENTIALS_FILE=%s\n' "$credential_file" >> "$GITHUB_ENV"
          fi

      - name: Generate weekly files
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=(--output-dir automation/weekly_publisher/output)
          if [[ -n "$AS_OF" ]]; then
            args+=(--as-of "$AS_OF")
          fi
          python3 automation/weekly_publisher/publisher.py "${args[@]}"

      - name: Delete temporary GA4 credentials
        if: always()
        run: |
          if [[ -n "${GA4_CREDENTIALS_FILE:-}" ]]; then
            rm -f "$GA4_CREDENTIALS_FILE"
          fi

      - name: Validate generated snapshot
        run: python3 -m json.tool automation/weekly_publisher/output/weekly-snapshot.json >/dev/null

      - name: Upload weekly review artifact
        uses: actions/upload-artifact@v4
        with:
          name: semitic-jew-weekly-publisher-${{ github.run_id }}
          path: automation/weekly_publisher/output/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update dated review issue
        uses: actions/github-script@v7
        env:
          OUTPUT_DIR: automation/weekly_publisher/output
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const output = process.env.OUTPUT_DIR;
            const snapshot = JSON.parse(fs.readFileSync(path.join(output, 'weekly-snapshot.json'), 'utf8'));
            const operations = fs.readFileSync(path.join(output, 'weekly-operations-report.md'), 'utf8');
            const newsletter = fs.readFileSync(path.join(output, 'weekly-newsletter-draft.md'), 'utf8');
            const date = snapshot.period.endDate;
            const title = `Weekly Publisher Review — ${date}`;
            const marker = '<!-- semitic-jew-weekly-publisher -->';
            const body = `${marker}\n${operations}\n\n---\n\n${newsletter}\n\n---\n\nArtifact: **semitic-jew-weekly-publisher-${context.runId}**`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
