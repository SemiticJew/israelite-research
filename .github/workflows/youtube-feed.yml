name: Update YouTube feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-feed
  cancel-in-progress: false

jobs:
  update-youtube-feed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - run: python scripts/fetch_youtube_feed.py
      - run: python scripts/fetch_youtube_podcast_playlist.py
      - run: python scripts/fetch_podcast_rss.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-videos.json data/youtube-podcast-videos.json data/podcast-episodes.json
          if git diff --cached --quiet; then
            echo "No YouTube feed changes."
            exit 0
          fi
          git commit -m "Update YouTube video feed"
          # Other automated jobs also push to main; rebase onto their commits and retry, never force-push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
